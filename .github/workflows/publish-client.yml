# publish-client.yml — FALCONS.AI Model Surgeon thin client (`falconsai-surgeon`) → PyPI via Trusted Publishing.
# Registered on PyPI as: owner Falcons-ai · repository falconsai-surgeon-thin-cli · workflow publish-client.yml ·
# environment pypi (and, on test.pypi.org, environment testpypi). No token is stored anywhere: PyPI accepts the
# upload because THIS workflow, in THIS repository, ran it (OpenID Connect, `id-token: write`).
# Reproducible: SOURCE_DATE_EPOCH is pinned to the value tools/build_client.py uses, so the wheel built here is
# byte-identical to the one the Model Surgeon server serves at /download/ for the same version.
# Path: a tag `vX.YY` (equal to pyproject's version) builds and rehearses on TestPyPI; the real index is reached ONLY
# by a manual dispatch with target=pypi, approved in the `pypi` environment — a PyPI version can never be re-uploaded.
name: publish-client
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "testpypi (rehearsal) or pypi (the real index)"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: build the wheel (reproducible) and check it
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --wheel --outdir dist
          python -m twine check dist/*.whl
      - name: the tag must equal pyproject's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "refs/tags/v$V" = "${{ github.ref }}" || { echo "tag ${{ github.ref }} != pyproject version $V"; exit 1; }
      - name: clean-room proof - the wheel imports no server code and refuses in words
        run: |
          python -m pip install --no-deps dist/*.whl
          python -I -c "import sys, surgeon, surgeon.client, surgeon.verify, surgeon.cli; bad=[m for m in sys.modules if m=='app' or m.startswith('app.')]; print('version', surgeon.__version__, 'app-modules:', bad); sys.exit(1 if bad else 0)"
          python -I -m surgeon.cli quantize x; test $? -eq 2
      - uses: actions/upload-artifact@v4
        with: { name: wheel, path: dist/*.whl }
  publish-testpypi:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi')
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: wheel, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { repository-url: "https://test.pypi.org/legacy/" }
  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: wheel, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
