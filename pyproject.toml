[build-system]
# THIN-1 ⑥ second half (V7.70): the backend is PINNED. The first PyPI upload (7.69, 2026-09-16) hashed `8dd0fdb9…`
# while the tree's wheel hashed `764d3bab…` from identical sources: `python -m build` in CI installed whatever
# setuptools/wheel was current and wrote a different `WHEEL` generator line (and so a different RECORD). Both sides now
# build with exactly these — tools/build_client.py refuses when its own environment differs (--no-build-isolation, offline).
requires = ["setuptools==68.1.2", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "falconsai-surgeon"
version = "7.70"
description = "Command-line client for FALCONS.AI Model Surgeon (surgeon.falcons.ai): upload a checkpoint into a browser session, replay recipes across a fleet, and verify any signed Surgeon package offline."
readme = "README.md"
requires-python = ">=3.9"
# THIN-1 ⑥b (V7.68): PyPI renders these on the project page. `license` is the SPDX expression form (the free-text
# `{text = ...}` form is deprecated since PEP 639); the client is proprietary and `surgeon/verify.py` carries its own
# Apache-2.0 header — LICENSE.txt in the wheel states both.
# NOTE (V7.68): the SPDX-string form of `license` and `license-files` (PEP 639) needs setuptools >= 77; the build
# environment here has an older one, so the file form is used — valid in every setuptools since 61 and rendered by
# PyPI as the license text. Move to the SPDX string when the build environment is upgraded.
license = {file = "LICENSE.txt"}
keywords = ["model-surgery", "safetensors", "neural-network", "attestation", "falconsai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = ["cryptography"]

[project.urls]
Homepage = "https://surgeon.falcons.ai/"
Pricing = "https://surgeon.falcons.ai/pricing"
Download = "https://surgeon.falcons.ai/download/"
Source = "https://github.com/Falcons-ai/falconsai-surgeon-thin-cli"
Issues = "https://github.com/Falcons-ai/falconsai-surgeon-thin-cli/issues"

[project.scripts]
surgeon = "surgeon.cli:main"

[tool.setuptools]
packages = ["surgeon"]
